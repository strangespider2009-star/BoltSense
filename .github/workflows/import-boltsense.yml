name: Import BoltSense project history

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-boltsense.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-project:
    if: github.repository == 'strangespider2009-star/BoltSense'
    runs-on: ubuntu-latest
    steps:
      - name: Check out bootstrap repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge 120 project commits without modifying workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          base64 --decode .boltsense-import.bundle.b64 > /tmp/boltsense-history.bundle
          git bundle verify /tmp/boltsense-history.bundle
          git fetch /tmp/boltsense-history.bundle 'refs/heads/main:refs/remotes/bolt-history/main'
          git merge --allow-unrelated-histories --no-ff --no-commit refs/remotes/bolt-history/main
          git rm -f .boltsense-import.bundle.b64
          git add -A
          git commit -m 'Merge verified 120-commit BoltSense project history'
          git push origin HEAD:main
